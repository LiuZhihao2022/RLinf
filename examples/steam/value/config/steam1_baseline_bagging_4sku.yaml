# =====================================================================
# BASELINE B3 — STEAM 1.0: expert data only, no DAgger.
#
# Cloned from steam2_model_bagging_4sku.yaml with the DAgger dataset removed
# and NOTHING else changed: same architecture, num_bins, k, seed, max_steps,
# optimiser and batch shape. The sole difference is whether the corpus
# contains failure data, so the gap between B3 and STEAM 2.0 is attributable
# to that and to nothing else.
#
# Why not reuse logs/steam_sft/bagging_4sku_steam1/...global_step_16000:
#   that checkpoint was trained on fty_0813+0814 only — 24% of this corpus.
#   Comparing against it would credit failure-aware supervision with a 4x
#   expert-data advantage, which is the first confound a reviewer would find.
#
# Negatives here come from rewind alone, exactly as in STEAM 1.0.
# =====================================================================
# STEAM value model SFT — RLinf FSDP runner.
#
# Usage:
#   bash examples/steam/value/run_steam_sft.sh steam_value_model
#
# The model default lives in ``config/model/steam.yaml`` and the FSDP
# training backend is loaded from the shared
# ``examples/sft/config/training_backend/fsdp.yaml`` via the hydra
# searchpath below.

defaults:
  - model/steam@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:REPO_PATH}/examples/sft/config/

cluster:
  num_nodes: 1 # 8卡用1，16卡用2
  component_placement:
    actor,env,rollout: all

runner:
  task_type: sft
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "steam1_baseline_bagging_4sku_sftonly_seed7_k64"
    logger_backends: ["wandb"]

  # Total training length is step-driven: max_steps bounds the run (keep it
  # in sync with actor.optim.total_training_steps); max_epochs: -1 = no
  # epoch-based limit.
  max_epochs: -1
  # 语料是 clean_table 的 5 倍 (sft 173 万帧 vs 34 万), 16000 步在这里只有
  # 2.4 个 epoch (clean_table 同步数是 11.9 个); 40000 步 ≈ 5.9 epoch。
  max_steps: 40000
  val_check_interval: -1
  save_interval: 4000

data:
  # One or more LeRobot datasets of success demos. Each entry must have a
  # dataset_path; extra fields like prompt / weight override per-dataset values.
  train_data_paths:
    # 12 份专家演示 (1456 eps / 1,731,144 帧)。上一版 value model 只训在
    # 0813+0814 (384k, 占语料 24%), 结果在其余数据上分数饱和、把全局阈值抬高;
    # 这里铺开到全部时期与两个操作员 (fty / zzc), 避免重蹈覆辙。
    - dataset_path: /mnt/public/guqiuyi/huggingface/lerobot/bagging_sku_fty_0706+0707
      type: "sft"
    - dataset_path: /mnt/public/guqiuyi/huggingface/lerobot/bagging_sku_fty_0708_trimmed
      type: "sft"
    - dataset_path: /mnt/public/guqiuyi/huggingface/lerobot/bagging_sku_fty_0714_trimmed
      type: "sft"
    - dataset_path: /mnt/public/guqiuyi/huggingface/lerobot/bagging_sku_fty_0715_trimmed
      type: "sft"
    - dataset_path: /mnt/public/guqiuyi/huggingface/lerobot/bagging_sku_fty_0717_trimmed
      type: "sft"
    - dataset_path: /mnt/public/guqiuyi/huggingface/lerobot/bagging_sku_zzc_0724_trimmed
      type: "sft"
    - dataset_path: /mnt/public/guqiuyi/huggingface/lerobot/bagging_sku_zzc_0730_trimmed
      type: "sft"
    - dataset_path: /mnt/public/guqiuyi/huggingface/lerobot/bagging_sku_zzc_0805_dagger
      type: "sft"
    - dataset_path: /mnt/public/guqiuyi/huggingface/lerobot/bagging_sku_zzc_0810
      type: "sft"
    - dataset_path: /mnt/public/guqiuyi/huggingface/lerobot/bagging_sku_zzc_0811_1_trimmed
      type: "sft"
    - dataset_path: /mnt/public/guqiuyi/huggingface/lerobot/bagging_sku_fty_0813_trimmed
      type: "sft"
    - dataset_path: /mnt/public/guqiuyi/huggingface/lerobot/bagging_sku_fty_0814_trimmed
      type: "sft"
    # (B3) DAgger 数据集在此基线中被移除 —— 这是与 STEAM 2.0 的唯一差别。

  balance_weights: true
  seed: 7 # 42 17 7
  dataset_type: sft
  # DAgger failure-segment loss: "hinge" (only pushes E[b] <= -margin) or
  # "ce_zero" (CE against the near-zero bin). Override per server, e.g.
  # data.fail_loss_mode=hinge  /  data.fail_loss_mode=ce_zero.
  # 语料中无 dagger 数据,该项不生效;保留仅为与 STEAM 2.0 配置逐行对齐。
  fail_loss_mode: hinge

  # Camera view names that the PairDataset loads from each LeRobot sample.
  # Any missing views become zero-placeholders with mask=False in the
  # processor output (masked out during camera mean-pool).
  camera_keys:
    - face_view
    - left_wrist_view
    - right_wrist_view
  # Pair sampling — same k for positive and negative. Negatives are
  # positive pairs fed in reversed order.
  k: 64
  only_success: true

  min_episode_length: null

  # Loader knobs (mirrors the recap value-sft surface).
  train_num_workers: 8
  eval_num_workers: 4
  prefetch_factor: 4
  persistent_workers: false
  pin_memory: false
  do_augment: false

algorithm:
  adv_type: gae   # unused here — retained for config shape parity

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 32 # 8卡用32，16卡用16
  global_batch_size: 512
  seed: 0

  # `actor.model` defaults come from ``model/steam``.
  # Per-experiment overrides go here.
  model:
    # Backbone load dtype for this run. Overrides the model default
    # (model/steam loads fp32) with bf16 to trade a little numerical
    # headroom for lower memory and higher throughput on this corpus.
    precision: bf16
    fusion_hidden_dim: 512
    dropout: 0.1
    label_smoothing: 0.05
    num_frames_per_pair: 2
    num_bins: 32 # 可改小，好训练一些
    vision_repo_id: "/mnt/public/guqiuyi/RLinf_active/pretrained_models/siglip2-so400m-patch14-224"
    language_repo_id: "/mnt/public/guqiuyi/RLinf_active/pretrained_models/gemma-3-270m"
    tokenizer_path: "/mnt/public/guqiuyi/RLinf_active/pretrained_models/gemma-3-270m"
    freeze_vision_encoder: false
    freeze_language_model: false
    include_state_in_prompt: false
    max_state_dim: 32
    state_discretization_bins: 256
    max_token_len: 200
    ensemble_size: 1
    ensemble_head_seed_base: 0
    use_gradient_checkpointing: true

  optim:
    lr: 5.0e-5
    value_lr: 5.0e-5
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-8
    weight_decay: 1.0e-5
    clip_grad: 10.0
    lr_scheduler: "constant"
    lr_warmup_steps: 500
    total_training_steps: 40000
    min_lr: 1.0e-6

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    use_orig_params: true
    gradient_checkpointing: False
    mixed_precision:
      param_dtype: bf16
      reduce_dtype: fp32
      buffer_dtype: fp32

reward:
  use_reward_model: False

critic:
  use_critic_model: False
