# STEAM value model SFT — RLinf FSDP runner.
#
# Usage:
#   bash examples/steam/value/run_steam_sft.sh steam_value_model
#
# The model default lives in ``config/model/steam.yaml`` and the FSDP
# training backend is loaded from the shared
# ``examples/sft/config/training_backend/fsdp.yaml`` via the hydra
# searchpath below.

defaults:
  - model/steam@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:REPO_PATH}/examples/sft/config/

cluster:
  num_nodes: 2 # 8卡用1，16卡用2
  component_placement:
    actor,env,rollout: all

runner:
  task_type: sft
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "steam_sft_fold_towel_seed7"
    logger_backends: ["wandb"]

  # Total training length is step-driven: max_steps bounds the run (keep it
  # in sync with actor.optim.total_training_steps); max_epochs: -1 = no
  # epoch-based limit.
  max_epochs: -1
  max_steps: 16000
  val_check_interval: -1
  save_interval: 4000

data:
  # One or more LeRobot datasets of success demos. Each entry must have a
  # dataset_path; extra fields like prompt / weight override per-dataset values.
  train_data_paths:
    - dataset_path: /mnt/public/guqiuyi/huggingface/lerobot/fold_towel_gqy_recap_sft
    # - dataset_path: /mnt/public/guqiuyi/huggingface/lerobot/clean_table_ygg06170618_steam_sft
    # - dataset_path: /mnt/public/guqiuyi/huggingface/lerobot/clean_table_ygg0618_steam_sft
      type: "sft"
    # - dataset_path: /mnt/public/guqiuyi/huggingface/lerobot/fold_towel_gqy_recap_rollout
    # - dataset_path: /mnt/public/guqiuyi/huggingface/lerobot/checkout_chips_gqy_recap_rollout
    # - dataset_path: /mnt/public/guqiuyi/huggingface/lerobot/restock_cola_gqy_recap_rollout
    #   type: "rollout"

  # When mixing multiple train datasets, sample according to each entry's
  # optional `weight` and optionally rebalance by dataset length.
  balance_weights: true
  seed: 7 # 42 17 7
  dataset_type: sft

  # Camera view names that the PairDataset loads from each LeRobot sample.
  # Any missing views become zero-placeholders with mask=False in the
  # processor output (masked out during camera mean-pool).
  camera_keys:
    - face_view
    - left_wrist_view
    - right_wrist_view
  # Pair sampling — same k for positive and negative. Negatives are
  # positive pairs fed in reversed order.
  k: 32
  only_success: true

  min_episode_length: null

  # Loader knobs (mirrors the recap value-sft surface).
  train_num_workers: 8
  eval_num_workers: 4
  prefetch_factor: 4
  persistent_workers: false
  pin_memory: false
  do_augment: false

algorithm:
  adv_type: gae   # unused here — retained for config shape parity

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 16 # 8卡用32，16卡用16
  global_batch_size: 512
  seed: 0

  # `actor.model` defaults come from ``model/steam``.
  # Per-experiment overrides go here.
  model:
    # Backbone load dtype for this run. Overrides the model default
    # (model/steam loads fp32) with bf16 to trade a little numerical
    # headroom for lower memory and higher throughput on this corpus.
    precision: bf16 # bf16
    fusion_hidden_dim: 512
    dropout: 0.1
    label_smoothing: 0.05
    num_frames_per_pair: 2
    num_bins: 32 # 可改小，好训练一些
    vision_repo_id: "/mnt/public/guqiuyi/RLinf_active/pretrained_models/siglip2-so400m-patch14-224"
    language_repo_id: "/mnt/public/guqiuyi/RLinf_active/pretrained_models/gemma-3-270m"
    tokenizer_path: "/mnt/public/guqiuyi/RLinf_active/pretrained_models/gemma-3-270m"
    freeze_vision_encoder: false
    freeze_language_model: false
    include_state_in_prompt: false
    max_state_dim: 32
    state_discretization_bins: 256
    max_token_len: 200
    ensemble_size: 1
    ensemble_head_seed_base: 0
    use_gradient_checkpointing: true

  optim:
    lr: 5.0e-5
    value_lr: 5.0e-5
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-8
    weight_decay: 1.0e-5
    clip_grad: 10.0
    lr_scheduler: "constant"
    lr_warmup_steps: 500
    total_training_steps: 16000
    min_lr: 1.0e-6

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    use_orig_params: true
    gradient_checkpointing: False
    mixed_precision:
      param_dtype: bf16
      reduce_dtype: fp32
      buffer_dtype: fp32

reward:
  use_reward_model: False

critic:
  use_critic_model: False
